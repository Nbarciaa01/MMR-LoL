services:
  - type: web
    name: mmrlol-web
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: RIOT_API_KEY
        sync: false
      - key: MMRLOL_ADMIN_TOKEN
        sync: false
      - key: RIOT_VERIFICATION_TEXT
        sync: false
      - key: MMRLOL_DATA_DIR
        value: /var/lib/mmrlol
      - key: ALLOWED_HOSTS
        sync: false
