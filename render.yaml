services:
  - type: web
    name: mmrlol-web
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: RIOT_API_KEY
        sync: false
      - key: RIOT_KEY_TYPE
        value: development
      - key: MMRLOL_ACCESS_MODE
        value: prototype
      - key: MMRLOL_VIEWER_USER
        value: mmr
      - key: MMRLOL_VIEWER_PASSWORD
        sync: false
      - key: MMRLOL_ADMIN_TOKEN
        sync: false
      - key: RIOT_VERIFICATION_TEXT
        sync: false
      - key: MMRLOL_DATA_DIR
        value: /var/lib/mmrlol
      - key: MMRLOL_TIMEZONE
        value: Europe/Madrid
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
